{% load i18n %}
{# "Step 2 of 6 · Location" as text, with a bar of six parts (screens 3.1). #}
<div class="space-y-2">
  <p class="text-sm font-medium text-green-800">{% blocktranslate with n=step total=steps|length title=step_title %}Step {{ n }} of {{ total }} · {{ title }}{% endblocktranslate %}</p>
  <ol class="grid grid-cols-6 gap-1" aria-hidden="true">
    {% for number in steps %}<li class="h-1.5 rounded-full {% if number <= step %}bg-green-700{% else %}bg-slate-200{% endif %}"></li>{% endfor %}
  </ol>
</div>
