{% extends "venues/_layout.html" %}
{% load i18n %}

{% block venue_content %}
  <form method="post" action="{% url 'manage:prices' venue.pk %}" class="space-y-8" novalidate>
    {% csrf_token %}

    {% include "venues/_prices_fields.html" %}

    {% if can_edit %}
      <button type="submit" class="btn-primary btn-block btn-lg">{% translate "Save prices" %}</button>
    {% endif %}
  </form>
{% endblock %}
