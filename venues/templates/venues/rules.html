{% extends "venues/_layout.html" %}
{% load i18n %}

{% block venue_content %}
  <div class="space-y-4">
    <div class="space-y-1">
      <h2 class="section-title">{% translate "Booking rules" %}</h2>
      <p class="text-sm text-slate-600">{% translate "Changes apply to new bookings only." %}</p>
    </div>
    <ul class="space-y-3">
      {% for item in items %}
        <li id="rule-{{ item.rule.field }}" class="card">
          <form method="post" class="space-y-2">
            {% csrf_token %}
            <input type="hidden" name="rule" value="{{ item.rule.field }}">
            <label for="value-{{ item.rule.field }}" class="block font-semibold">{{ item.rule.question }}</label>
            <p class="text-sm text-slate-600">{{ item.rule.example }}</p>
            <div class="flex gap-2">
              <select id="value-{{ item.rule.field }}" name="value" class="input text-lg">
                {% for value, label in item.rule.choices %}
                  <option value="{{ value }}"{% if item.current == value|stringformat:"s" %} selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
              <button type="submit" class="btn-primary shrink-0">{% translate "Save" %}</button>
            </div>
          </form>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
