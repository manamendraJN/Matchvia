{% extends "venues/setup/_frame.html" %}
{% load i18n %}

{% block setup_content %}
  <form method="post" class="space-y-4" novalidate>
    {% csrf_token %}
    <p class="text-sm text-slate-600">{% translate "We filled in 6:00 am to 12:00 am every day. Change any day that is different." %}</p>
    {% include "venues/_hours_fields.html" %}
    <button type="submit" class="w-full rounded-lg bg-green-700 px-4 py-3 text-lg font-semibold text-white hover:bg-green-800">{% translate "Next" %}</button>
  </form>
{% endblock %}
