{% extends "venues/_layout.html" %}
{% load i18n %}

{% block venue_content %}
  <form method="post" action="{% url 'manage:hours' venue.pk %}" class="space-y-4" novalidate>
    {% csrf_token %}
    {% include "venues/_hours_fields.html" %}

    <a href="{% url 'manage:close_day' venue.pk %}" class="btn-secondary btn-block">{% translate "Close a day" %}</a>

    {% if can_edit %}
      <button type="submit" class="btn-primary btn-block btn-lg">{% translate "Save hours" %}</button>
    {% endif %}
  </form>
{% endblock %}
