{% extends "venues/_layout.html" %}
{% load i18n %}

{% block venue_content %}
  <form method="post" action="{% url 'manage:hours' venue.pk %}" class="space-y-4" novalidate>
    {% csrf_token %}
    {% include "venues/_hours_fields.html" %}

    <a href="{% url 'manage:close_day' venue.pk %}" class="block rounded-lg border border-slate-300 bg-white px-4 py-3 text-center font-semibold text-slate-800 hover:bg-slate-50">{% translate "Close a day" %}</a>

    {% if can_edit %}
      <button type="submit" class="w-full rounded-lg bg-green-700 px-4 py-3 text-lg font-semibold text-white hover:bg-green-800">{% translate "Save hours" %}</button>
    {% endif %}
  </form>
{% endblock %}
