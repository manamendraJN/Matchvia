[project]
name = "matchvia"
version = "0.1.0"
description = "Book your court. Bring your team. Futsal and indoor cricket court booking for Sri Lanka."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography~=50.0.2",
    "django~=6.1.3",
    "django-environ~=0.14.0",
    "pillow~=13.0",
    "psycopg[binary]~=3.3.9",
    "whitenoise~=6.12.0",
]

[dependency-groups]
dev = [
    "bandit~=1.9.4",
    "factory-boy~=3.3.3",
    "pip-audit~=2.10.1",
    "pre-commit~=4.7.0",
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
    "pytest-django~=4.14.0",
    "ruff~=0.17.6",
    "time-machine~=3.6.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**", "staticfiles", ".tools"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "DJ",       # django
    "S",        # bandit rules
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
]
# RUF012 wants ClassVar on mutable class attributes, which fights Django's declarative
# style (admin list_display, Meta.constraints, form fields).
# RUF001-003 flag en dashes and non-Latin letters as "ambiguous": we use en dashes in
# user-facing text ("Mon–Fri") and will add Sinhala and Tamil strings.
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and dummy credentials.
"tests/**" = ["S101", "S105", "S106"]
"*/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
# Settings modules layer on top of base.py with star imports by design.
"config/settings/*.py" = ["F403", "F405"]
# SVG path data: long strings of numbers, not code.
"core/icons.py" = ["E501"]

# ---------------------------------------------------------------- pytest
# Test discovery covers tests/ and every app's tests/ package.
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "tests/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    "scripts/*",
    ".venv/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = [".venv", "tests", "staticfiles", ".tools"]
