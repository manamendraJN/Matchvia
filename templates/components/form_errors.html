{% load matchvia %}
{% if form.non_field_errors %}
  <div class="flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-900" role="alert">
    {% icon "alert" "mt-0.5 size-5 shrink-0 text-red-700" %}
    <div class="space-y-1">{% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}</div>
  </div>
{% endif %}
