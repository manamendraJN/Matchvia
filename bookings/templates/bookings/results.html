{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Find a court" %} · Matchvia{% endblock %}

{% block content %}
  <section class="space-y-6">
    <details class="rounded-xl border border-slate-200 bg-white p-4" {% if not searched %}open{% endif %}>
      <summary class="cursor-pointer font-semibold">{% translate "Change search" %}</summary>
      <div class="mt-4">{% include "bookings/_search_form.html" with live=True %}</div>
    </details>
    <div id="results">{% include "bookings/_results.html" %}</div>
  </section>
{% endblock %}
